<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress · Study workspace</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header><a class="brand" href="/">Study workspace</a><nav><a href="/quiz.html">Practice</a><a href="/stats.html" aria-current="page">Progress</a></nav></header><main><section class="hero compact"><p class="eyebrow">Saved progress</p><h1>See the pattern.</h1><p>First attempts, repeats, and question coverage are shown separately.</p></section><section class="panel"><div class="controls"><label>Book or bank<select id="bank"></select></label><button id="refresh" class="button secondary">Refresh</button></div><p id="status" role="status"></p></section><section id="dashboard" hidden><div id="cards" class="grid"></div><div class="grid charts"><article class="panel"><h2>Last 14 days</h2><div id="daily" class="bars"></div></article><article class="panel"><h2>Last 8 weeks</h2><div id="weekly" class="bars"></div></article></div><section class="panel"><h2>Topics</h2><div id="topics"></div></section><section class="panel"><h2>Question ranking</h2><div class="controls"><label>Topic<select id="filter-topic"><option value="">All topics</option></select></label><label>Status<select id="filter-status"><option value="all">All</option><option value="unanswered">Unanswered</option><option value="wrong">With errors</option></select></label><label>Sort<select id="sort"><option value="attempts">Most attempts</option><option value="errors">Most errors</option><option value="number">Question number</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Question</th><th>Topic</th><th>Attempts</th><th>Correct</th><th>Wrong</th><th>Status</th></tr></thead><tbody id="ranking"></tbody></table></div></section><section class="panel"><h2>Learner comments</h2><ul id="comments"></ul></section></section></main><footer><a href="/quiz.html">Continue practice</a></footer><script src="/assets/stats.js" defer></script></body></html>
